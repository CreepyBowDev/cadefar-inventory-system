<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">P2. PAQUETE DE PROVEEDORES Y LABORATORIOS</title>
  <desc id="description">CU10–CU13. Tres interfaces, un controlador HTTP y tres tablas físicas. ProveedorLaboratorio es una única entidad. Las dependencias de usuario y bitacora_auditoria resumen autenticación previa y captura automática, sin llamar a sus controladores. Tres relaciones HTTP y tres dependencias independientes.</desc>
  <defs>
    <marker id="dependency-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.5"/></marker>
    <g id="component" fill="#e2efda" stroke="#548235" stroke-width="1.2"><rect x="4" y="0" width="17" height="22"/><rect x="0" y="4" width="9" height="5"/><rect x="0" y="13" width="9" height="5"/></g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
      .box { fill: #e2efda; stroke: #548235; stroke-width: 1.3; }
      .stereotype { font-size: 17px; text-anchor: middle; }
      .filename { font-size: 16px; text-anchor: middle; }
      .name { font-size: 18px; text-anchor: middle; }
      .http { fill: none; stroke: #303030; stroke-width: 1.5; }
      .dependency { fill: none; stroke: #303030; stroke-width: 1.5; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="#fff"/>
  <text x="30" y="40" font-size="25" font-weight="bold">P2. PAQUETE DE PROVEEDORES Y LABORATORIOS</text>
  <rect x="30" y="110" width="1440" height="650" fill="#fff" stroke="#548235" stroke-width="1.3"/>
  <rect x="30" y="75" width="420" height="35" fill="#a9d18e" stroke="#548235" stroke-width="1.3"/>
  <text x="240" y="98" font-size="19" text-anchor="middle">PROVEEDORES Y LABORATORIOS</text>
  <g id="interfaces">
    <g id="providers-page"><rect class="box" x="60" y="180" width="400" height="80"/><use href="#component" x="427" y="190"/><text class="stereotype" x="260" y="207">«Interface»</text><text class="filename" x="260" y="238">ProveedoresPage.jsx</text></g>
    <g id="provider-form"><rect class="box" x="550" y="180" width="400" height="80"/><use href="#component" x="917" y="190"/><text class="stereotype" x="750" y="207">«Interface»</text><text class="filename" x="750" y="238">ProveedorLaboratorioFormPage.jsx</text></g>
    <g id="provider-detail"><rect class="box" x="1040" y="180" width="400" height="80"/><use href="#component" x="1407" y="190"/><text class="stereotype" x="1240" y="207">«Interface»</text><text class="filename" x="1240" y="238">ProveedorLaboratorioDetailPage.jsx</text></g>
  </g>
  <g id="http-connections" class="http">
    <path id="list-to-provider" d="M 260 260 V 300 H 630 V 344"/>
    <path id="form-to-provider" d="M 750 260 V 344"/>
    <path id="detail-to-provider" d="M 1240 260 V 300 H 870 V 344"/>
    <circle cx="630" cy="350" r="6" fill="#fff"/><circle cx="750" cy="350" r="6" fill="#fff"/><circle cx="870" cy="350" r="6" fill="#fff"/>
    <path d="M 630 356 V 370 M 750 356 V 370 M 870 356 V 370"/>
  </g>
  <g id="controllers">
    <g id="provider-controller"><rect class="box" x="530" y="370" width="440" height="80"/><use href="#component" x="937" y="380"/><text class="stereotype" x="750" y="397">«Class»</text><text class="name" x="750" y="428">proveedor-laboratorio.controller.js</text></g>
  </g>
  <g id="persistence-connections" class="dependency" marker-end="url(#dependency-arrow)">
    <path id="provider-to-user" d="M 630 450 V 520 H 260 V 620"/>
    <path id="provider-to-provider" d="M 750 450 V 620"/>
    <path id="provider-to-audit" d="M 870 450 V 520 H 1240 V 620"/>
  </g>
  <g id="tables">
    <g id="user-table"><rect class="box" x="110" y="620" width="300" height="80"/><use href="#component" x="377" y="630"/><text class="stereotype" x="260" y="647">«Table»</text><text class="name" x="260" y="678">usuario</text></g>
    <g id="provider-table"><rect class="box" x="600" y="620" width="300" height="80"/><use href="#component" x="867" y="630"/><text class="stereotype" x="750" y="647">«Table»</text><text class="name" x="750" y="678">proveedor_laboratorio</text></g>
    <g id="audit-table"><rect class="box" x="1090" y="620" width="300" height="80"/><use href="#component" x="1357" y="630"/><text class="stereotype" x="1240" y="647">«Table»</text><text class="name" x="1240" y="678">bitacora_auditoria</text></g>
  </g>
  <path class="http" d="M 45 805 H 110"/><circle cx="117" cy="805" r="6" fill="#fff" stroke="#303030" stroke-width="1.5"/>
  <text x="135" y="811" font-size="17">HTTP mediante servicios frontend y Axios</text>
  <path class="dependency" d="M 700 805 H 770" marker-end="url(#dependency-arrow)"/>
  <text x="790" y="811" font-size="17">Persistencia indirecta mediante servicios y repositorios</text>
  <text x="45" y="855" font-size="16">CU10–CU13 · 3 interfaces · 1 controlador · 3 tablas · Incluye autenticación previa y captura automática de auditoría.</text>
</svg>
