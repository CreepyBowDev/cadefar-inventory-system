    <path id="list-to-ingredient" d="M 2340 260 V 344"/>
    <path id="form-to-ingredient" d="M 2740 260 V 300 H 2520 V 344"/>
    <path id="form-to-provider" d="M 620 180 V 140 H 3100 V 344"/>
    <circle cx="420" cy="350" r="6" fill="#fff"/><circle cx="600" cy="350" r="6" fill="#fff"/><circle cx="780" cy="350" r="6" fill="#fff"/><circle cx="1600" cy="350" r="6" fill="#fff"/><circle cx="2340" cy="350" r="6" fill="#fff"/><circle cx="2520" cy="350" r="6" fill="#fff"/><circle cx="3100" cy="350" r="6" fill="#fff"/>
    <path d="M 420 356 V 370 M 600 356 V 370 M 780 356 V 370 M 1600 356 V 370 M 2340 356 V 370 M 2520 356 V 370 M 3100 356 V 370"/>
  </g>
  <g id="controllers">
    <g id="medicine-controller"><rect class="box" x="300" y="370" width="640" height="80"/><use href="#component" x="907" y="380"/><text class="stereotype" x="620" y="397">«Class»</text><text class="name" x="620" y="428">medicamento.controller.js</text></g>
    <g id="composition-controller"><rect class="box" x="1420" y="370" width="480" height="80"/><use href="#component" x="1867" y="380"/><text class="stereotype" x="1660" y="397">«Class»</text><text class="name" x="1660" y="428">composicion-medicamento.controller.js</text></g>
    <g id="ingredient-controller"><rect class="box" x="2250" y="370" width="360" height="80"/><use href="#component" x="2577" y="380"/><text class="stereotype" x="2430" y="397">«Class»</text><text class="name" x="2430" y="428">principio-activo.controller.js</text></g>
    <g id="provider-controller"><rect class="box" x="2890" y="370" width="440" height="80"/><use href="#component" x="3297" y="380"/><text class="stereotype" x="3110" y="397">«Class»</text><text class="name" x="3110" y="428">proveedor-laboratorio.controller.js</text></g>
  </g>
  <!-- Abanico superior: medicamentos. Carriles exteriores e inferiores: dependencias compartidas. -->
  <g id="persistence-connections" class="dependency" marker-end="url(#dependency-arrow)">
    <path id="medicine-to-user" d="M 400 450 V 830 H 200 V 900"/>
    <path id="medicine-to-provider" d="M 460 450 V 800 H 600 V 900"/>
    <path id="medicine-to-ingredient" d="M 520 450 V 770 H 1000 V 900"/>
    <path id="medicine-to-composition" d="M 580 450 V 740 H 1400 V 900"/>
    <path id="medicine-to-medicine" d="M 640 450 V 710 H 1800 V 900"/>
    <path id="medicine-to-existence" d="M 700 450 V 680 H 2200 V 900"/>
    <path id="medicine-to-movement" d="M 760 450 V 650 H 2600 V 900"/>
    <path id="medicine-to-audit" d="M 820 450 V 620 H 3000 V 900"/>
    <path id="composition-to-movement" d="M 1480 450 V 590 H 3380 V 1060 H 2600 V 980"/>
    <path id="composition-to-existence" d="M 1580 450 V 568 H 3420 V 1100 H 2200 V 980"/>
