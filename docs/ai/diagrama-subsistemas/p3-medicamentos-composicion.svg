    <path id="ingredient-to-ingredient" d="M 2430 450 V 502 H 3540 V 1220 H 1000 V 980"/>
    <path id="provider-to-provider" d="M 3110 450 V 480 H 3580 V 1260 H 600 V 980"/>
  </g>
  <g id="tables">
    <g id="user-table"><rect class="box" x="50" y="900" width="300" height="80"/><use href="#component" x="317" y="910"/><text class="stereotype" x="200" y="927">«Table»</text><text class="name" x="200" y="958">usuario</text></g>
    <g id="provider-table"><rect class="box" x="450" y="900" width="300" height="80"/><use href="#component" x="717" y="910"/><text class="stereotype" x="600" y="927">«Table»</text><text class="name" x="600" y="958">proveedor_laboratorio</text></g>
    <g id="ingredient-table"><rect class="box" x="850" y="900" width="300" height="80"/><use href="#component" x="1117" y="910"/><text class="stereotype" x="1000" y="927">«Table»</text><text class="name" x="1000" y="958">principio_activo</text></g>
    <g id="composition-table"><rect class="box" x="1250" y="900" width="300" height="80"/><use href="#component" x="1517" y="910"/><text class="stereotype" x="1400" y="927">«Table»</text><text class="name" x="1400" y="958">composicion_medicamento</text></g>
    <g id="medicine-table"><rect class="box" x="1650" y="900" width="300" height="80"/><use href="#component" x="1917" y="910"/><text class="stereotype" x="1800" y="927">«Table»</text><text class="name" x="1800" y="958">medicamento</text></g>
    <g id="existence-table"><rect class="box" x="2050" y="900" width="300" height="80"/><use href="#component" x="2317" y="910"/><text class="stereotype" x="2200" y="927">«Table»</text><text class="name" x="2200" y="958">existencia_medicamento</text></g>
    <g id="movement-table"><rect class="box" x="2450" y="900" width="300" height="80"/><use href="#component" x="2717" y="910"/><text class="stereotype" x="2600" y="927">«Table»</text><text class="name" x="2600" y="958">movimiento_inventario</text></g>
    <g id="audit-table"><rect class="box" x="2850" y="900" width="300" height="80"/><use href="#component" x="3117" y="910"/><text class="stereotype" x="3000" y="927">«Table»</text><text class="name" x="3000" y="958">bitacora_auditoria</text></g>
  </g>
  <text x="70" y="1310" font-size="16">Historial: consulta de existencias y movimientos, sin modificar saldos. Dependencias secundarias compartidas y selectores: véase la matriz de P3 en subsistemas.md.</text>
  <path class="http" d="M 45 1390 H 110"/><circle cx="117" cy="1390" r="6" fill="#fff" stroke="#303030" stroke-width="1.5"/>
  <text x="135" y="1396" font-size="17">Comunicación HTTP mediante servicios frontend y Axios</text>
  <path class="dependency" d="M 860 1390 H 930" marker-end="url(#dependency-arrow)"/>
  <text x="950" y="1396" font-size="17">Persistencia indirecta: Controller → Service → Repository → Sequelize → MySQL</text>
  <text x="45" y="1440" font-size="16">CU14–CU20 · 6 interfaces · 4 controladores · 8 tablas · 7 relaciones HTTP y 14 dependencias principales; sin omitir controladores ni tablas participantes.</text>
</svg>
