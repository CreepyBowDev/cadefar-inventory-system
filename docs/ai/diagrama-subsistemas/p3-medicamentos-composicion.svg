<svg xmlns="http://www.w3.org/2000/svg" width="3700" height="1500" viewBox="0 0 3700 1500" role="img" aria-labelledby="title description">
  <title id="title">P3. PAQUETE DE MEDICAMENTOS Y COMPOSICIÓN</title>
  <desc id="description">CU14–CU20. Seis interfaces, cuatro controladores HTTP y ocho tablas físicas en tres filas. Catorce dependencias principales independientes. Incluye proveedor, principios, composición, comprobación de historial, autenticación y auditoría automática. Las dependencias compartidas secundarias se detallan en subsistemas.md; no se representa una llamada entre controladores.</desc>
  <defs>
    <marker id="dependency-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.5"/></marker>
    <g id="component" fill="#e2efda" stroke="#548235" stroke-width="1.2"><rect x="4" y="0" width="17" height="22"/><rect x="0" y="4" width="9" height="5"/><rect x="0" y="13" width="9" height="5"/></g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
      .box { fill: #e2efda; stroke: #548235; stroke-width: 1.3; }
      .stereotype { font-size: 17px; text-anchor: middle; }
      .filename { font-size: 16px; text-anchor: middle; }
      .name { font-size: 18px; text-anchor: middle; }
      .http { fill: none; stroke: #303030; stroke-width: 1.5; }
      .dependency { fill: none; stroke: #303030; stroke-width: 1.5; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="3700" height="1500" fill="#fff"/>
  <text x="30" y="40" font-size="25" font-weight="bold">P3. PAQUETE DE MEDICAMENTOS Y COMPOSICIÓN</text>
  <rect x="30" y="110" width="3640" height="1230" fill="#fff" stroke="#548235" stroke-width="1.3"/>
  <rect x="30" y="75" width="430" height="35" fill="#a9d18e" stroke="#548235" stroke-width="1.3"/>
  <text x="245" y="98" font-size="19" text-anchor="middle">MEDICAMENTOS Y COMPOSICIÓN</text>
  <g id="interfaces">
    <g id="medicines-page"><rect class="box" x="50" y="180" width="300" height="80"/><use href="#component" x="317" y="190"/><text class="stereotype" x="200" y="207">«Interface»</text><text class="filename" x="200" y="238">MedicamentosPage.jsx</text></g>
    <g id="medicine-form"><rect class="box" x="450" y="180" width="300" height="80"/><use href="#component" x="717" y="190"/><text class="stereotype" x="600" y="207">«Interface»</text><text class="filename" x="600" y="238">MedicamentoFormPage.jsx</text></g>
    <g id="medicine-detail"><rect class="box" x="850" y="180" width="300" height="80"/><use href="#component" x="1117" y="190"/><text class="stereotype" x="1000" y="207">«Interface»</text><text class="filename" x="1000" y="238">MedicamentoDetailPage.jsx</text></g>
    <g id="composition-page"><rect class="box" x="1430" y="180" width="340" height="80"/><use href="#component" x="1737" y="190"/><text class="stereotype" x="1600" y="207">«Interface»</text><text class="filename" x="1600" y="238">MedicamentoComposicionPage.jsx</text></g>
    <g id="ingredients-page"><rect class="box" x="2180" y="180" width="320" height="80"/><use href="#component" x="2467" y="190"/><text class="stereotype" x="2340" y="207">«Interface»</text><text class="filename" x="2340" y="238">PrincipiosActivosPage.jsx</text></g>
    <g id="ingredient-form"><rect class="box" x="2580" y="180" width="320" height="80"/><use href="#component" x="2867" y="190"/><text class="stereotype" x="2740" y="207">«Interface»</text><text class="filename" x="2740" y="238">PrincipioActivoFormPage.jsx</text></g>
  </g>
  <g id="http-connections" class="http">
    <path id="list-to-medicine" d="M 200 260 V 300 H 420 V 344"/>
    <path id="form-to-medicine" d="M 600 260 V 344"/>
    <path id="detail-to-medicine" d="M 1000 260 V 300 H 780 V 344"/>
