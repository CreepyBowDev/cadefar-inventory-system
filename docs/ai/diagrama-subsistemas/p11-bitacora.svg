<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1540" viewBox="0 0 1900 1540" role="img" aria-labelledby="title description">
  <title id="title">P11. PAQUETE DE BITÁCORA</title>
  <desc id="description">CU42. Listado, filtros, paginación y detalle mediante dos páginas React y un único Controller HTTP. Usuario por autenticación y bitacora_auditoria por lectura y evento sensible posterior. No representa todas las pantallas que producen auditoría ni agrega tablas por referencias JSON.</desc>
  <defs>
    <marker id="dependency-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#303030" stroke-width="1.5"/></marker>
    <g id="component" fill="#e2efda" stroke="#548235" stroke-width="1.2"><rect x="4" y="0" width="17" height="22"/><rect x="0" y="4" width="9" height="5"/><rect x="0" y="13" width="9" height="5"/></g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #000; }
      .box { fill: #e2efda; stroke: #548235; stroke-width: 1.3; }
      .stereotype { font-size: 17px; text-anchor: middle; }
      .filename { font-size: 16px; text-anchor: middle; }
      .name { font-size: 18px; text-anchor: middle; }
      .http { fill: none; stroke: #303030; stroke-width: 1.5; }
      .dependency { fill: none; stroke: #303030; stroke-width: 1.5; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1900" height="1540" fill="#fff"/>
  <text x="30" y="40" font-size="25" font-weight="bold">P11. PAQUETE DE BITÁCORA</text>
  <rect x="30" y="110" width="1840" height="1270" fill="#fff" stroke="#548235" stroke-width="1.3"/>
  <rect x="30" y="75" width="430" height="35" fill="#a9d18e" stroke="#548235" stroke-width="1.3"/>
  <text x="245" y="98" font-size="19" text-anchor="middle">BITÁCORA</text>
  <g id="interfaces">
    <g id="interface-0"><rect class="box" x="40" y="180" width="320" height="80"/><use href="#component" x="327" y="190"/><text class="stereotype" x="200" y="207">«Interface»</text><text class="filename" x="200" y="238">BitacoraPage.jsx</text></g>
    <g id="interface-1"><rect class="box" x="840" y="180" width="320" height="80"/><use href="#component" x="1127" y="190"/><text class="stereotype" x="1000" y="207">«Interface»</text><text class="filename" x="1000" y="238">BitacoraDetailPage.jsx</text></g>
  </g>
  <g id="http-connections" class="http">
    <path id="http-0" d="M 200 260 V 300 H 420 V 344"/>
    <path id="http-1" d="M 1000 260 V 300 H 780 V 344"/>
    <circle cx="420" cy="350" r="6" fill="#fff"/>
    <circle cx="780" cy="350" r="6" fill="#fff"/>
    <path id="http-0-stem" d="M 420 356 V 370"/>
    <path id="http-1-stem" d="M 780 356 V 370"/>
  </g>
  <g id="controllers">
    <g id="controller-0"><rect class="box" x="200" y="370" width="800" height="80"/><use href="#component" x="967" y="380"/><text class="stereotype" x="600" y="397">«Class»</text><text class="name" x="600" y="428">bitacora-auditoria.controller.js</text></g>
  </g>
  <!-- Una ruta independiente por relación; secundarias justificadas en subsistemas.md. -->
  <g id="persistence-connections" class="dependency" marker-end="url(#dependency-arrow)">
    <path id="dependency-upper-0" data-controller="0" data-table="0" d="M 400 450 V 1010 H 200 V 1100"/>
    <path id="dependency-upper-1" data-controller="0" data-table="1" d="M 500 450 V 980 H 600 V 1100"/>
  </g>
  <g id="tables">
    <g id="table-0"><rect class="box" x="50" y="1100" width="300" height="80"/><use href="#component" x="317" y="1110"/><text class="stereotype" x="200" y="1127">«Table»</text><text class="name" x="200" y="1158">usuario</text></g>
    <g id="table-1"><rect class="box" x="450" y="1100" width="300" height="80"/><use href="#component" x="717" y="1110"/><text class="stereotype" x="600" y="1127">«Table»</text><text class="name" x="600" y="1158">bitacora_auditoria</text></g>
  </g>
  <text x="70" y="1350" font-size="16">Solo Administrador. Página/total en snapshot propio; evento sensible posterior. Identidades y referencias históricas sin JOIN ni consultas a módulos de origen.</text>
  <path class="http" d="M 45 1430 H 110"/><circle cx="117" cy="1430" r="6" fill="#fff" stroke="#303030" stroke-width="1.5"/>
  <text x="135" y="1436" font-size="17">Comunicación HTTP mediante servicios frontend y Axios</text>
  <path class="dependency" d="M 860 1430 H 930" marker-end="url(#dependency-arrow)"/>
  <text x="950" y="1436" font-size="17">Persistencia indirecta: Controller → Service → Repository → Sequelize → MySQL</text>
  <text x="45" y="1480" font-size="16">CU42 · 2 interfaces · 1 controladores · 2 tablas · 2 relaciones HTTP y 2 dependencias. Secundarias: subsistemas.md.</text>
</svg>
