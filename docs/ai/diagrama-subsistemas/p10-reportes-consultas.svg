  <title id="title">P10. PAQUETE DE REPORTES Y CONSULTAS</title>
  <desc id="description">CU38–CU41, incluido CU40 compartido con CU24/P4. Reportes consulta cabeceras de ventas/compras y retiros originales; Inventario atiende el historial y Exportación sus descargas. Nueve tablas físicas, incluidas autenticación y auditoría. Relaciones secundarias justificadas por rama en subsistemas.md.</desc>
