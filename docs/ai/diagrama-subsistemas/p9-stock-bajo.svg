  <rect x="30" y="75" width="430" height="35" fill="#a9d18e" stroke="#548235" stroke-width="1.3"/>
  <text x="245" y="98" font-size="19" text-anchor="middle">STOCK BAJO</text>
  <g id="interfaces">
    <g id="interface-0"><rect class="box" x="440" y="180" width="320" height="80"/><use href="#component" x="727" y="190"/><text class="stereotype" x="600" y="207">«Interface»</text><text class="filename" x="600" y="238">InventarioPage.jsx</text></g>
  </g>
